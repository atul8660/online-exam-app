<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="description" content="Online Exam is a simple timed multiple-choice assessment." />
    <title>Online Exam</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">Online Exam</a>
    </header>

    <main id="app" class="page-shell" aria-live="polite">
      <section class="welcome-view">
        <section class="exam-card" aria-labelledby="exam-title">
          <h2 id="exam-title">General knowledge</h2>
          <p class="exam-summary"><span id="question-count">5 questions</span> · 10 minutes</p>
          <button id="start-exam" class="primary-button" type="button">Start exam</button>
        </section>
      </section>

      <section id="exam-view" class="exam-view" hidden></section>
      <section id="result-view" class="result-view" hidden></section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
